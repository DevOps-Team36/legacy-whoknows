{{ define "body" }}
<div class="auth-page">
  <div class="auth-container auth-container--narrow">

    <div class="auth-card">
      <div class="auth-card-decoration">
        <span class="material-symbols-outlined">lock_reset</span>
      </div>

      <div class="auth-header">
        <h1 class="auth-title">Change Password</h1>
        <p class="auth-subtitle">Your account requires a new password before continuing.</p>
      </div>

      {{ if .Error }}
        <div class="error-message"><strong>Error:</strong> {{ .Error }}</div>
      {{ end }}

      <form action="/api/change-password" method="post">
        <div class="form-group">
          <label class="form-label" for="current_password">Current Password</label>
          <div class="input-icon-wrapper">
            <span class="material-symbols-outlined input-icon">key</span>
            <input class="form-input form-input-with-icon" id="current_password" name="current_password" type="password" placeholder="Current password" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">New Password</label>
          <div class="input-icon-wrapper">
            <span class="material-symbols-outlined input-icon">password</span>
            <input class="form-input form-input-with-icon" id="password" name="password" type="password" placeholder="New password" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password2">Confirm New Password</label>
          <div class="input-icon-wrapper">
            <span class="material-symbols-outlined input-icon">done</span>
            <input class="form-input form-input-with-icon" id="password2" name="password2" type="password" placeholder="Confirm new password" required>
          </div>
        </div>

        <div class="form-submit">
          <button class="btn-primary" id="change-password-button" type="submit">
            <span>Update Password</span>
            <span class="material-symbols-outlined" style="font-size:1.125rem;">arrow_forward</span>
          </button>
        </div>
      </form>
    </div>

  </div>
</div>
{{ end }}

{{ template "layout" . }}
