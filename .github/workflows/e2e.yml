---
name: E2E Tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2

      - name: Start services
        working-directory: server_go
        run: docker compose -f docker-compose.e2e.yml up -d --build --wait

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server_go/e2e/package-lock.json

      - name: Install dependencies
        working-directory: server_go/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: server_go/e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: server_go/e2e
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: playwright-report
          path: server_go/e2e/playwright-report/
          retention-days: 30

      - name: Tear down services
        if: always()
        working-directory: server_go
        run: docker compose -f docker-compose.e2e.yml down -v
